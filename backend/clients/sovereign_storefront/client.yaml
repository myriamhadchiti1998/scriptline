# ─────────────────────────────────────────────────────────────────────────────
# CLIENT CONFIG — Marcus Vane / The Sovereign Storefront
#
# This file is the *structured* layer of the client's context. The prose
# Reference Pack (reference_pack.md, same folder) is injected into every prompt
# verbatim; this YAML holds the machine-checkable facts the quality gate
# enforces deterministically (proof IDs, allowed numbers, banned language, CTAs).
#
# Adding a new client = copy this folder, swap reference_pack.md, edit this file.
# No prompt or code changes are needed.
# ─────────────────────────────────────────────────────────────────────────────

id: sovereign_storefront
display_name: "Marcus Vane — The Sovereign Storefront"
spokesperson: "Marcus Vane"
product: "The Sovereign Storefront"
member_term: "members"            # what the audience is called in copy

# ── Funnel & CTAs ────────────────────────────────────────────────────────────
funnel:
  landing_page: "sovereignstorefront.dummy/first-pallet"
  front_end_offer: "$1 two-hour \"First Pallet\" trial workshop"
  stages:
    cold:
      description: >-
        Cold traffic (Facebook/YouTube/TikTok). Prospect is solution-aware but
        scarred. Lead with the internal state (emotional hook families 1-4),
        explain the mechanism, let the offer arrive late. CTA = low-commitment
        $1 workshop. Never pitch the Core/Concierge upsell price.
      primary_cta: "Watch the First Pallet workshop for $1. See exactly how it works, then decide."
      alternate_ctas: ["Grab a $1 seat"]
      # The CTA section must contain >=1 term from EACH group (case-insensitive)
      required_cta_terms:
        - ["$1", "a dollar", "one dollar"]
        - ["workshop", "first pallet", "seat"]
    retargeting:
      description: >-
        Retargeting / mid-funnel. Prospect is product-aware (has seen the ad or
        page). Mechanism-first and procedural hooks are allowed here. Handle
        objections directly. Organic urgency only (lots refresh weekly).
      primary_cta: "See this week's matched inventory."
      alternate_ctas: ["Grab a $1 seat", "Watch the First Pallet workshop for $1. See exactly how it works, then decide."]
      required_cta_terms:
        - ["$1", "a dollar", "one dollar", "this week's matched", "match sheet", "matched inventory", "workshop", "first pallet", "seat"]

# ── Avatars (ideas must target exactly one) ──────────────────────────────────
avatars:
  - id: dana
    label: "Dana, the Burned Earner (49, Ohio)"
    key_phrase: "What's the catch this time?"
    core_pains: ["burned by a ~$2,400 dropshipping course she never finished", "skeptical spouse", "distrusts her own judgment"]
  - id: lorraine
    label: "Lorraine, the Anxious Near-Retiree (58, rural England)"
    key_phrase: "Can someone like me actually do this?"
    core_pains: ["worried savings won't stretch", "low tech confidence", "wants a small real project with dignity"]
  - id: theo
    label: "Theo, the Time-Strapped Contractor (41, Texas)"
    key_phrase: "Will this waste my time?"
    core_pains: ["no spare hours", "needs exact steps", "won't spend six months guessing"]
  - id: ray
    label: "Ray, the Methodical Skeptic (46, Canada)"
    key_phrase: "Walk me through the economics."
    core_pains: ["looks for the catch", "needs the incentives to line up", "reads the fine print"]
  - id: marisol
    label: "Marisol, the Restarting Parent (44, Arizona)"
    key_phrase: "Is this something I could be proud of?"
    core_pains: ["one income household", "wants to contribute again", "wants a thing that's hers"]

creative_types: ["talking-head", "UGC", "listicle", "story", "demo", "objection-handler", "founder-confessional"]
lead_types: ["problem-led", "proof-led", "curiosity-led", "offer-led"]
hook_families:
  - "F1 Identity & Belonging"
  - "F2 Cost of Inaction & Fear"
  - "F3 Story & Transformation (Marcus, first person)"
  - "F4 Enemy / Contrarian"
  - "Belief hooks (Hopeless / Helpless / Worthless)"
  - "Avatar hooks"
  - "LAB profile hooks"
  - "Mechanism / procedural (retargeting only)"

# ── PROOF BANK ───────────────────────────────────────────────────────────────
