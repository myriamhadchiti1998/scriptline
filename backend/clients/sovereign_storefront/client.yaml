    descriptor: "Contractor, Texas, 41, no spare time"
    quote: "I do my listings after the kids are down. The match sheet means I'm not staring at a screen wondering what to sell."
  - id: T3
    type: testimonial
    person: "Lorraine P."
    descriptor: "Semi-retired, England, 58, very low tech confidence"
    quote: "I'm not a computer person and I got my first lot listed with the template. The fact he never promised me money is exactly why I trusted him."
  - id: T4
    type: testimonial
    person: "Ray C."
    descriptor: "Analyst, Canada, 46, skeptic"
    quote: "I went in looking for the catch. The catch is that you have to actually do the weekly work. The economics hold up, which is more than I can say for the last three."
  - id: T5
