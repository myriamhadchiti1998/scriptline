# ── FACT ALLOWLISTS (deterministic anti-fabrication gate) ────────────────────
# Any number, dollar figure, or percentage in a script that is not listed here
# fails checklist item 8 automatically, regardless of what the AI reviewer says.
facts:
  allowed_numbers: [1, 2, 3, 4, 5, 11, 14, 20, 22, 25, 30, 38, 40, 41, 44, 45, 46, 49, 50, 52, 55, 58, 60, 75, 90, 200, 2024, 9400]
  allowed_dollar_amounts: [1, 99, 149, 197, 199, 299, 497, 746, 1450, 2400, 6800]
  allowed_percentages: []          # internal market data — never in ad copy
  # Proper nouns the scripts may use. Anything else that looks like a name is
  # flagged for the AI reviewer to verify against the Reference Pack.
  allowed_proper_nouns:
    [Marcus, Vane, Sovereign, Storefront, Dana, Theo, Lorraine, Ray, Marisol,
     Ohio, Texas, England, Canada, Arizona, US, UK, Australia, America,
     United, States, Kingdom,
     First, Pallet, Liquidator, Match, Core, Concierge, Boring, Economics,
     Store, Starter, Midwest, Reseller, Summit, Backroom, Logistics, Weekly,
     Operators, Watch, Method, Facebook, YouTube, TikTok, FBA, Amazon, FTC,
     Step, Hook, I, I'm, I've, I'd, I'll]
  # Entities whose appearance is an automatic fabrication fail (never in pack).
  forbidden_entities:
    [Walmart, Target, Costco, "Home Depot", Forbes, "Shark Tank", CNN, "Fox News",
     "Wall Street", Inc., "Entrepreneur magazine", Oprah, Harvard, Shopify, eBay,
     Etsy, "Facebook Marketplace", Craigslist, Poshmark, Mercari, "as seen on"]

# ── LANGUAGE RULES (from Reference Pack §06 / §10) ───────────────────────────
# level: hard  → automatic fail of the named checklist item
# level: flag  → passed to the AI reviewer as "inspect this in context"
#               (e.g. "I won't insult you by calling it passive" is on-brand)
# negatable: if true, a negator in the preceding words (not/never/won't/no/
#            insult/without...) downgrades the hit to "ok".
language_rules:
  - {pattern: '\b(make|making|made|earn|earning|earned|pull(?:ing)? in|bring(?:ing)? in|clear(?:ing)?)\s+(?:up to\s+|over\s+|about\s+)?\$\s?\d[\d,]*(?:\s?k\b)?', level: hard, item: 8, reason: "Earnings claim (dollar figure tied to what someone makes)"}
  - {pattern: '\$\s?\d[\d,]*\s*(?:k\b)?\s*(?:/|per|a|an|every)\s*(?:day|week|month|year|hour|hr)\b', level: hard, item: 8, reason: "Earnings rate claim ($X per period)"}
  - {pattern: '\b(?:six|seven|five|multi)[- ]figures?\b', level: hard, item: 8, reason: "Income-figure language"}
  - {pattern: '\bmillions?\b', level: hard, item: 7, reason: "Get-rich language (millions)"}
  - {pattern: '\bstudents?\b', level: hard, item: 7, reason: "Audience must be called 'members', never students"}
  - {pattern: '\bpassive(?:\s+income)?\b', level: hard, item: 7, negatable: true, reason: "Promises 'passive' (brand frame is 'a few evenings a week')"}
  - {pattern: '\bauto[- ]?pilot\b', level: hard, item: 7, negatable: true, reason: "Autopilot promise"}
  - {pattern: '\b(?:fire your boss|laptop lifestyle|wage slave|money[- ]printing|guaranteed results|get rich quick)\b', level: hard, item: 7, reason: "Guru / hype language listed as off-brand"}
  - {pattern: '\b(?:spots? (?:are )?(?:almost gone|left|remaining)|only \d+ (?:spots|seats)|before (?:it''s|its) too late|price goes up)\b', level: hard, item: 7, reason: "Fake scarcity / urgency theatre"}
  - {pattern: '\b(?:lambo(?:rghini)?s?|mansions?|yachts?|private jet)\b', level: flag, item: 7, reason: "Luxury imagery — only acceptable as an explicit contrast (Marcus has none)"}
  - {pattern: '\b(?:financial freedom|quit your job|set it and forget it|while you sleep|effortless|no work required|easiest|so easy)\b', level: flag, item: 7, negatable: true, reason: "Avoid-list phrase — acceptable only when quoting/contrasting the hype model"}
  - {pattern: '\b(?:countdown|timer|act now|hurry|limited time)\b', level: flag, item: 7, negatable: true, reason: "Urgency language — must be organic (weekly lot refresh) or a contrast"}
  - {pattern: '\b(?:profit|revenue|income)\b', level: flag, item: 8, negatable: true, reason: "Money word — must not imply what a member will make"}
  - {pattern: '\b(?:guarantee[ds]?|proven to)\b', level: flag, item: 8, negatable: true, reason: "Guarantee language — the brand device is the anti-guarantee"}

# ── VOICE & RHYTHM thresholds (deterministic half of checklist item 7) ───────
voice:
  max_exclamation_marks: 0          # "Calm — no exclamation storms"
  max_all_caps_words: 0             # "no all-caps" (acronyms below are exempt)
  caps_exempt: [US, UK, FBA, FTC, CTA, OK, TV]
  avg_sentence_words: [6, 17]       # plainspoken, unhurried: short declaratives
  max_sentence_words: 32
  signature_phrases_hint: >-
    "Boring on purpose. Boring is what survives." · "A few evenings a week. I'm
    not going to insult you by calling it passive." · "The liquidators pay me."

# ── SCRIPT LENGTH (checklist item 6) ─────────────────────────────────────────
script:
  words_per_second: 2.5             # ~150 wpm, calm delivery
  min_seconds: 60
  max_seconds: 180
  target_words: [190, 380]          # A-roll = one hook + main body
  hook_first_sentence_max_words: 20 # pattern interrupt must land in ~3 seconds
  max_hook_similarity: 0.5          # three hooks must be genuinely distinct
