    type: credential
    text: "Marcus spent 14 years managing a regional wholesale logistics depot."
  - id: C2
    type: credential
    text: "11 vetted regional liquidator partners under signed placement agreements (never named in ads)."
  - id: C3
    type: credential
    text: "5 years running the Sovereign Storefront program; weekly match sheets running continuously for 5 years."
  - id: C4
    type: scale
    text: "9,400+ enrolled members across the US, Canada, UK, and Australia."
  - id: C5
    type: credential
    text: "Featured speaker at the 2024 Midwest Reseller Summit."
  - id: C6
    type: credential
    text: "Named one of \"30 Operators to Watch\" by trade outlet Backroom Logistics Weekly."
  - id: M1
    type: mechanism
    text: "Regional liquidators pay Marcus a placement fee only when member stores actually move their inventory — members don't pay him up front for results; his income depends on their stores working (aligned incentive, quality is self-correcting)."
